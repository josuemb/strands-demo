[project]
name = "strands-demo"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.21.2",
    "strands-agents>=1.17.0",
    "strands-agents-tools>=0.2.16",
]

[dependency-groups]
dev = [
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
